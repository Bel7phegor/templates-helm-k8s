{{- if .Values.global.enabledComponents.secrets }}
apiVersion: v1
kind: Secrets
metadata:
  name: {{ .Values.global.appName }}-{{ .Values.secrets.name }}-secret
  namespace: {{ .Values.global.namespace }}
type: {{ .Values.secrets.type }}
stringData:
  {{- toYaml .Values.secrets.stringData | nindent 2 }}
{{- end }}
